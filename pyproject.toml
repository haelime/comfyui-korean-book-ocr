[project]
name = "comfyui-korean-book-ocr"
version = "0.6.1"
description = "Masked Korean book OCR, editable text, and annotated quote rendering for ComfyUI"
requires-python = ">=3.10,<3.14"
dependencies = [
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
]

[project.urls]
Repository = "https://github.com/haelime/comfyui-korean-book-ocr"

[tool.comfy]
PublisherId = "haelime"
DisplayName = "Korean Book OCR"
